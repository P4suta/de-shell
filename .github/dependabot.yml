version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /adapters/nushell
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: chore(cargo)
    groups:
      rust-runtime:
        dependency-type: production
        patterns:
          - "*"
      rust-development:
        dependency-type: development
        patterns:
          - "*"
