name: Release

on:
  push:
    tags:
      - v0.1.0-rc.1
      - v0.1.0
  workflow_dispatch:

permissions: read-all

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  release-qualification:
    name: Final release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0

      - name: Install coverage instrumentation
        run: rustup component add llvm-tools-preview

      - name: Install checksum-verified coverage tool
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Keep the release-candidate measurement reproducible
        if: github.ref_name != 'v0.1.0'
        run: cargo llvm-cov --locked --workspace --all-targets --summary-only --fail-under-lines 90 -- --test-threads=1

      - name: Enforce the final 0.1.0 coverage contract
        if: github.ref_name == 'v0.1.0'
        run: |
          cargo llvm-cov --locked --workspace --all-targets --json --summary-only --fail-under-lines 90 --output-path target/release-coverage.json -- --test-threads=1
          python3 scripts/check-release-coverage.py target/release-coverage.json

  dynamic-analysis:
    name: Fuzz, Miri, ASan, and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned dynamic-analysis toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@nightly-2026-07-15

      - name: Install Miri and Rust sources
        run: rustup component add miri rust-src

      - name: Install checksum-verified cargo-fuzz
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none

      - name: Fuzz every parser and protocol boundary from its saved corpus
        env:
          ASAN_OPTIONS: detect_leaks=0
        shell: bash
        run: |
          cargo fuzz run frontend fuzz/corpus/frontend -- -runs=512 -max_len=65536
          cargo fuzz run scanner fuzz/corpus/scanner -- -runs=512 -max_len=65536
          cargo fuzz run protocol fuzz/corpus/protocol -- -runs=512 -max_len=65536
          cargo fuzz run schema fuzz/corpus/schema -- -runs=512 -max_len=65536

      - name: Interpret strict document decoding with Miri
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/deshell-miri-target
          XDG_CACHE_HOME: ${{ runner.temp }}/deshell-miri-cache
        run: cargo miri test -p deshell strict_json::tests::decodes_a_strict_document -- --exact

      - name: Run the complete implementation under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          CARGO_TARGET_DIR: ${{ runner.temp }}/deshell-asan-target
          RUSTFLAGS: -Zsanitizer=address --cfg deshell_sanitizer_address
        run: cargo test --locked -p deshell --target x86_64-unknown-linux-gnu -- --test-threads=1

      - name: Run native parser code under UndefinedBehaviorSanitizer
        env:
          CC: clang
          CXX: clang++
          # Tree-sitter grammars use a legacy external-scanner function prototype;
          # keep every other UBSan class fatal while excluding that known ABI check.
          CFLAGS: -fsanitize=undefined -fno-sanitize=function
          CXXFLAGS: -fsanitize=undefined -fno-sanitize=function
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_DIR: ${{ runner.temp }}/deshell-ubsan-target
          RUSTFLAGS: -Clink-arg=-fsanitize=undefined --cfg deshell_sanitizer_undefined
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cargo test --locked -p deshell --target x86_64-unknown-linux-gnu -- --test-threads=1

  migration-e2e:
    name: Migration E2E (${{ matrix.interpreter }}, ${{ matrix.generator }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            interpreter: sh
            generator: rust
          - runner: ubuntu-24.04
            interpreter: sh
            generator: go
          - runner: ubuntu-24.04
            interpreter: bash
            generator: rust
          - runner: ubuntu-24.04
            interpreter: bash
            generator: go
          - runner: ubuntu-24.04
            interpreter: zsh
            generator: rust
          - runner: ubuntu-24.04
            interpreter: zsh
            generator: go
          - runner: ubuntu-24.04
            interpreter: fish
            generator: rust
          - runner: ubuntu-24.04
            interpreter: fish
            generator: go
          - runner: ubuntu-24.04
            interpreter: nu
            generator: rust
          - runner: ubuntu-24.04
            interpreter: nu
            generator: go
          - runner: windows-2025
            interpreter: powershell
            generator: rust
          - runner: windows-2025
            interpreter: powershell
            generator: go
          - runner: windows-2025
            interpreter: cmd
            generator: rust
          - runner: windows-2025
            interpreter: cmd
            generator: go
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install migration toolchains
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0 go@1.27.0 powershell@7.6.5

      - name: Install zsh and fish runtimes
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh fish

      - name: Install checksum-pinned Nushell runtime
        if: matrix.interpreter == 'nu'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/nu-0.115.1-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/nushell-0.115.1"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-gnu.tar.gz
          echo 'd11d825241f6504a3617c535fa725a9dd6d009c86d7b19fb3168b47635b9d8b0  '"$archive" | sha256sum --check --strict
          mkdir "$install_root"
          tar --extract --gzip --file "$archive" --directory "$install_root"
          nu_binary="$(find "$install_root" -type f -name nu -print -quit)"
          test -n "$nu_binary"
          chmod +x "$nu_binary"
          dirname "$nu_binary" >> "$GITHUB_PATH"

      - name: Build the migration oracle
        run: cargo build --locked -p deshell

      - name: Retire the representative interpreter corpus with independent Evidence
        run: cargo run --locked -p xtask -- migration-e2e ${{ matrix.interpreter }} ${{ matrix.generator }}

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: deshell
            archive: deshell-0.1.0-x86_64-unknown-linux-musl.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: deshell
            archive: deshell-0.1.0-aarch64-unknown-linux-musl.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: deshell
            archive: deshell-0.1.0-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: deshell
            archive: deshell-0.1.0-aarch64-apple-darwin.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: deshell.exe
            archive: deshell-0.1.0-x86_64-pc-windows-msvc.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: deshell.exe
            archive: deshell-0.1.0-aarch64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0

      - name: Install musl development tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Add release target
        run: rustup target add ${{ matrix.target }}

      - name: Test host implementation
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }} -p deshell

      - name: Smoke test version, schemas, and all internal agents
        shell: pwsh
        run: |
          $binary = Join-Path 'target' (Join-Path '${{ matrix.target }}' (Join-Path 'release' '${{ matrix.executable }}'))
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'deshell 0.1.0') { throw 'version smoke test failed' }
          foreach ($schemaName in @('inventory', 'manifest', 'bundle', 'effect-ir', 'evidence', 'diagnostic', 'protocol', 'project', 'scenario', 'lock', 'replay', 'corpus-audit', 'generator-protocol', 'migration-request', 'proposal', 'migration-plan', 'migration-evidence', 'archive-manifest', 'audit-finding', 'harden-plan', 'harden-approval', 'harden-evidence')) {
            $schema = & $binary schema $schemaName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $schema.'$schema' -ne 'https://json-schema.org/draft/2020-12/schema') { throw "schema smoke test failed: $schemaName" }
          }
          foreach ($mode in @('__process-agent', '__observer-agent', '__nushell-adapter', '__generator')) {
            $request = '{"id":1,"jsonrpc":"2.0","method":"deshell.handshake","params":{"protocol_version":1}}'
            $response = $request | & $binary $mode | ConvertFrom-Json
            $valid = if ($mode -eq '__generator') { $response.result.protocol -eq 'deshell.generator.v1' } else { $response.result.protocol_version -eq 1 }
            if ($LASTEXITCODE -ne 0 -or -not $valid) { throw "$mode handshake failed" }
          }

      - name: Create archive
        shell: pwsh
        run: |
          $stage = Join-Path 'dist' 'deshell-0.1.0'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path 'target' (Join-Path '${{ matrix.target }}' (Join-Path 'release' '${{ matrix.executable }}'))) $stage
          Copy-Item LICENSE, README.md $stage
          $archivePath = Join-Path (Resolve-Path 'dist').Path '${{ matrix.archive }}'
          if ('${{ matrix.archive }}'.EndsWith('.zip')) {
            Compress-Archive -Path $stage -DestinationPath $archivePath
          } else {
            tar -C dist -czf $archivePath 'deshell-0.1.0'
          }

      - name: Smoke test the installed archive
        shell: pwsh
        run: |
          $archivePath = Join-Path (Resolve-Path 'dist').Path '${{ matrix.archive }}'
          $installRoot = Join-Path $env:RUNNER_TEMP 'deshell-install-smoke'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          if ('${{ matrix.archive }}'.EndsWith('.zip')) {
            Expand-Archive -Path $archivePath -DestinationPath $installRoot
          } else {
            tar -C $installRoot -xzf $archivePath
          }
          $installed = Join-Path $installRoot (Join-Path 'deshell-0.1.0' '${{ matrix.executable }}')
          $version = & $installed --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'deshell 0.1.0') { throw 'archive version smoke test failed' }
          foreach ($schemaName in @('inventory', 'manifest', 'bundle', 'effect-ir', 'evidence', 'diagnostic', 'protocol', 'project', 'scenario', 'lock', 'replay', 'corpus-audit', 'generator-protocol', 'migration-request', 'proposal', 'migration-plan', 'migration-evidence', 'archive-manifest', 'audit-finding', 'harden-plan', 'harden-approval', 'harden-evidence')) {
            $schema = & $installed schema $schemaName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $schema.'$schema' -ne 'https://json-schema.org/draft/2020-12/schema') { throw "archive schema smoke test failed: $schemaName" }
          }
          foreach ($mode in @('__process-agent', '__observer-agent', '__nushell-adapter', '__generator')) {
            $request = '{"id":1,"jsonrpc":"2.0","method":"deshell.handshake","params":{"protocol_version":1}}'
            $response = $request | & $installed $mode | ConvertFrom-Json
            $valid = if ($mode -eq '__generator') { $response.result.protocol -eq 'deshell.generator.v1' } else { $response.result.protocol_version -eq 1 }
            if ($LASTEXITCODE -ne 0 -or -not $valid) { throw "archive $mode handshake failed" }
          }

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Sign, attest, and publish
    if: ${{ github.ref == 'refs/tags/v0.1.0-rc.1' || github.ref == 'refs/tags/v0.1.0' }}
    needs:
      - build
      - dynamic-analysis
      - release-qualification
      - migration-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0

      - name: Install checksum-verified SBOM generator
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: syft@1.51.0
          fallback: none

      - name: Download all six archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate and validate the CycloneDX SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft scan dir:. \
            --source-name deshell \
            --source-version 0.1.0 \
            --output cyclonedx-json=dist/deshell-0.1.0.cdx.json
          jq --exit-status \
            '.bomFormat == "CycloneDX" and .specVersion != null and (.components | length > 0)' \
            dist/deshell-0.1.0.cdx.json

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum deshell-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest with keyless Sigstore
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish crates.io package after owner approval
        if: github.ref_name == 'v0.1.0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p deshell

      - name: Create release and upload signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then prerelease='--prerelease'; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes ${prerelease}
