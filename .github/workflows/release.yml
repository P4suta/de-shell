name: Release

on:
  push:
    tags:
      - v0.1.0-rc.1
      - v0.1.0
  workflow_dispatch:

permissions: read-all

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: deshell
            archive: deshell-0.1.0-x86_64-unknown-linux-musl.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: deshell
            archive: deshell-0.1.0-aarch64-unknown-linux-musl.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: deshell
            archive: deshell-0.1.0-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: deshell
            archive: deshell-0.1.0-aarch64-apple-darwin.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: deshell.exe
            archive: deshell-0.1.0-x86_64-pc-windows-msvc.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: deshell.exe
            archive: deshell-0.1.0-aarch64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0

      - name: Install musl development tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Add release target
        run: rustup target add ${{ matrix.target }}

      - name: Test host implementation
        run: cargo test --locked --workspace

      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }} -p deshell

      - name: Smoke test version, schemas, and all internal agents
        shell: pwsh
        run: |
          $binary = Join-Path 'target' (Join-Path '${{ matrix.target }}' (Join-Path 'release' '${{ matrix.executable }}'))
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'deshell 0.1.0') { throw 'version smoke test failed' }
          $schema = & $binary schema effect-ir | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $schema.properties.schema_version.const -ne 1) { throw 'schema smoke test failed' }
          foreach ($mode in @('__process-agent', '__observer-agent', '__nushell-adapter')) {
            $request = '{"id":1,"jsonrpc":"2.0","method":"deshell.handshake","params":{"protocol_version":1}}'
            $response = $request | & $binary $mode | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $response.result.protocol_version -ne 1) { throw "$mode handshake failed" }
          }

      - name: Create archive
        shell: pwsh
        run: |
          $stage = Join-Path 'dist' 'deshell-0.1.0'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path 'target' (Join-Path '${{ matrix.target }}' (Join-Path 'release' '${{ matrix.executable }}'))) $stage
          Copy-Item LICENSE, README.md $stage
          $archivePath = Join-Path (Resolve-Path 'dist').Path '${{ matrix.archive }}'
          if ('${{ matrix.archive }}'.EndsWith('.zip')) {
            Compress-Archive -Path $stage -DestinationPath $archivePath
          } else {
            tar -C dist -czf $archivePath 'deshell-0.1.0'
          }

      - name: Smoke test the installed archive
        shell: pwsh
        run: |
          $archivePath = Join-Path (Resolve-Path 'dist').Path '${{ matrix.archive }}'
          $installRoot = Join-Path $env:RUNNER_TEMP 'deshell-install-smoke'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          if ('${{ matrix.archive }}'.EndsWith('.zip')) {
            Expand-Archive -Path $archivePath -DestinationPath $installRoot
          } else {
            tar -C $installRoot -xzf $archivePath
          }
          $installed = Join-Path $installRoot (Join-Path 'deshell-0.1.0' '${{ matrix.executable }}')
          $version = & $installed --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'deshell 0.1.0') { throw 'archive version smoke test failed' }
          $schema = & $installed schema effect-ir | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $schema.properties.schema_version.const -ne 1) { throw 'archive schema smoke test failed' }
          foreach ($mode in @('__process-agent', '__observer-agent', '__nushell-adapter')) {
            $request = '{"id":1,"jsonrpc":"2.0","method":"deshell.handshake","params":{"protocol_version":1}}'
            $response = $request | & $installed $mode | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $response.result.protocol_version -ne 1) { throw "archive $mode handshake failed" }
          }

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Sign, attest, and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0

      - name: Download all six archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum deshell-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest with keyless Sigstore
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*

      - name: Publish crates.io package after owner approval
        if: github.ref_name == 'v0.1.0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p deshell

      - name: Create release and upload signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then prerelease='--prerelease'; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes ${prerelease}
