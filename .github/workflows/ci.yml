name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0 go@1.27.0 actionlint@1.7.12 powershell@7.6.5

      - name: Install checksum-pinned Nushell
        shell: pwsh
        run: ./scripts/install-nushell.ps1

      - name: Materialize mise Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install Rust lint components
        run: rustup component add clippy rustfmt

      - name: Lint package metadata
        run: mise run lint

      - name: Check formatting
        run: mise run fmt:check

      - name: Run Rust unit, property, platform, and security tests
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Run shared CLI, schema, golden, and agent conformance
        run: |
          cargo build --locked -p deshell
          cargo run --locked -p xtask -- conformance target/debug/deshell

      - name: Build and verify crates.io package
        run: cargo package --locked

  security-and-coverage:
    name: Supply chain and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0 go@1.27.0 powershell@7.6.5 pipx:check-jsonschema@0.38.0

      - name: Install checksum-pinned Nushell
        shell: pwsh
        run: ./scripts/install-nushell.ps1

      - name: Install coverage instrumentation
        run: rustup component add llvm-tools-preview

      - name: Install checksum-verified security and coverage tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-llvm-cov@0.8.7
          fallback: none

      - name: Audit the locked dependency graph with RustSec
        run: cargo audit --db target/cargo-audit-db --deny warnings

      - name: Enforce advisory, license, duplicate, and source policy
        run: cargo deny --locked check

      - name: Validate generated v1 documents with an independent schema engine
        run: mise run test:schema-validator

      - name: Enforce the v0.1 line-coverage contract
        run: cargo llvm-cov --locked --workspace --all-targets --summary-only --fail-under-lines 90 -- --test-threads=1

  official-exporters:
    name: Official exporter validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned exporter toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@1.98.0 powershell@7.6.5 dagger@0.21.8

      - name: Confirm Docker is available
        run: docker version

      - name: Install checksum-pinned Nushell
        shell: pwsh
        run: ./scripts/install-nushell.ps1

      - name: Validate and run CWL, Dagger, and Nushell artifacts with official tools
        run: mise run test:official-exporters

  reference-conformance:
    name: OCaml v1 reference conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned opam
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: opam@2.5.2

      - name: Create the private OCaml reference switch
        run: mise run reference:setup

      - name: Build the OCaml Effect IR v1 reference
        run: mise run reference:build

      - name: Check OCaml reference formatting
        run: mise run reference:fmt:check

      - name: Compare shared lowering, transform, and export goldens
        run: mise run reference:test

  fuzz-smoke:
    name: Saved-corpus fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned fuzzing toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@nightly-2026-07-15 powershell@7.6.5

      - name: Install checksum-pinned Nushell
        shell: pwsh
        run: ./scripts/install-nushell.ps1

      - name: Install registry-checksummed cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Exercise every saved corpus under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        shell: bash
        run: |
          cargo +nightly-2026-07-15 fuzz run frontend fuzz/corpus/frontend -- -runs=64 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run scanner fuzz/corpus/scanner -- -runs=64 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run protocol fuzz/corpus/protocol -- -runs=64 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run schema fuzz/corpus/schema -- -runs=64 -max_len=65536

  required-gate:
    name: Required gate
    if: ${{ always() }}
    needs:
      - test
      - security-and-coverage
      - official-exporters
      - reference-conformance
      - fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm the complete matrix passed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security-and-coverage.result }}
          EXPORTER_RESULT: ${{ needs.official-exporters.result }}
          REFERENCE_RESULT: ${{ needs.reference-conformance.result }}
          FUZZ_RESULT: ${{ needs.fuzz-smoke.result }}
        shell: bash
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "The required OS matrix result was: $MATRIX_RESULT"
            exit 1
          fi
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "The supply-chain and coverage result was: $SECURITY_RESULT"
            exit 1
          fi
          if [ "$REFERENCE_RESULT" != "success" ]; then
            echo "The OCaml v1 reference result was: $REFERENCE_RESULT"
            exit 1
          fi
          if [ "$EXPORTER_RESULT" != "success" ]; then
            echo "The official exporter result was: $EXPORTER_RESULT"
            exit 1
          fi
          if [ "$FUZZ_RESULT" != "success" ]; then
            echo "The saved-corpus fuzz smoke result was: $FUZZ_RESULT"
            exit 1
          fi
