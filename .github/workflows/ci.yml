name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true

      - name: Materialize mise Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install Linux opam sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor bubblewrap
          sudo tee /etc/apparmor.d/deshell-bwrap > /dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace /etc/apparmor.d/deshell-bwrap

      - name: Create project-local OCaml switch
        run: mise run setup

      - name: Lint package metadata
        run: mise run lint

      - name: Check formatting
        run: mise run fmt:check

      - name: Run all test gates
        run: mise run test

      - name: Build opam package
        run: mise run package

  required-gate:
    name: Required gate
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm the complete matrix passed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "The required OS matrix result was: $MATRIX_RESULT"
            exit 1
          fi
