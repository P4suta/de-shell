name: Nightly dynamic analysis

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: nightly-dynamic-analysis
  cancel-in-progress: false

jobs:
  fuzz:
    name: Long saved-corpus fuzz run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned fuzzing toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@nightly-2026-07-15

      - name: Install checksum-verified cargo-fuzz
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none

      - name: Fuzz each boundary for fifteen minutes
        env:
          ASAN_OPTIONS: detect_leaks=0
        shell: bash
        run: |
          cargo fuzz run frontend fuzz/corpus/frontend -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo fuzz run scanner fuzz/corpus/scanner -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo fuzz run protocol fuzz/corpus/protocol -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo fuzz run schema fuzz/corpus/schema -- -max_total_time=900 -timeout=10 -max_len=65536

      - name: Preserve reproducer inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
