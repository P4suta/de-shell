name: Nightly dynamic analysis

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: nightly-dynamic-analysis
  cancel-in-progress: false

jobs:
  fuzz:
    name: Long saved-corpus fuzz run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned fuzzing toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.6
          cache: true
          install_args: rust@nightly-2026-07-15 powershell@7.6.5

      - name: Install checksum-pinned Nushell
        shell: pwsh
        run: ./scripts/install-nushell.ps1

      - name: Install registry-checksummed cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Fuzz each boundary for fifteen minutes
        env:
          ASAN_OPTIONS: detect_leaks=0
        shell: bash
        run: |
          cargo +nightly-2026-07-15 fuzz run frontend fuzz/corpus/frontend -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run scanner fuzz/corpus/scanner -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run protocol fuzz/corpus/protocol -- -max_total_time=900 -timeout=10 -max_len=65536
          cargo +nightly-2026-07-15 fuzz run schema fuzz/corpus/schema -- -max_total_time=900 -timeout=10 -max_len=65536

      - name: Preserve reproducer inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
