[workspace]
members = ["xtask"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(deshell_sanitizer_address)", "cfg(deshell_sanitizer_undefined)"] }
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
# The default Clippy set is part of the repository contract even when a caller
# forgets `-D warnings`. More opinionated lints are named below instead of
# enabling `pedantic` or `restriction` wholesale: those groups contain mutually
# contradictory policies such as requiring and forbidding implicit returns.
all = { level = "deny", priority = -1 }

# The raw APIs listed in clippy.toml are unavailable outside the module that
# implements the intent they belong to. See clippy.toml for the reasoning.
disallowed_methods = "deny"
disallowed_types = "deny"

# An `#[allow]` must say why. The exemptions this crate carries are narrow — the
# transactional layer, and test modules that construct the very situations the
# production ban exists to prevent — and both are only reviewable if the reason
# travels with the attribute.
allow_attributes_without_reason = "deny"

# `#[allow]` itself is banned in favour of `#[expect]`. An `expect` that stops
# being necessary warns, so a suppression cannot outlive the thing it suppressed;
# an `allow` goes quiet forever and is how a ban rots into decoration.
allow_attributes = "deny"

# Failure must stay in the type system in production. Tests may unwrap, expect,
# and panic because a panic is their assertion mechanism; clippy.toml records
# that deliberate boundary.
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Ignored failures and values must be named. `_error` / `_cleanup_result`
# documents a deliberate best-effort boundary; an anonymous `_` hides whether
# somebody noticed a `Result` at all.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

# Unsafe code is allowed only at the small OS boundary, with a reviewable
# invariant on every block and one operation per block.
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

# Ownership and allocation must say what they mean. These catch accidental
# double indirection, heap-backed collections inside another box, silent Rc/Arc
# clones, and synchronization primitives heavier than the value requires.
borrowed_box = "deny"
box_collection = "deny"
assigning_clones = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_allocation = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"
vec_box = "deny"

# String construction is explicit about allocation and mutation. `+` on an
# owned String hides which operand is moved and often leaves a needless clone.
str_to_string = "deny"
string_add = "deny"
string_add_assign = "deny"

# Data shapes encode states rather than boolean bags or nested Options.
option_option = "deny"
struct_excessive_bools = "deny"
wildcard_enum_match_arm = "deny"

# Numeric conversions must either be infallible by type or handle the failed
# conversion. `as` is tolerated only where Clippy proves no target-dependent
# truncation, wrapping, sign loss, or floating-point precision loss.
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
fn_to_numeric_cast_any = "deny"
unnecessary_cast = "deny"

# Keep expensive values and locks bounded and explicit.
large_futures = "deny"
large_include_file = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"

# Additional correctness traps. These are named individually because the
# complete `restriction` group is internally contradictory and therefore is
# not a usable policy.
borrow_as_ptr = "deny"
collection_is_never_read = "deny"
default_union_representation = "deny"
empty_drop = "deny"
exit = "deny"
fallible_impl_from = "deny"
float_cmp_const = "deny"
if_then_some_else_none = "deny"
iter_over_hash_type = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
path_buf_push_overwrite = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
unnecessary_safety_comment = "deny"
unused_result_ok = "deny"

[package]
name = "deshell"
description = "Shell retirement migration oracle with independent equivalence evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "deshell"
include = [
  "/crates/deshell/src/**",
  "/contracts/**",
  "/adapters/powershell/adapter.ps1",
  "/README.md",
  "/LICENSE",
]

[[bin]]
name = "deshell"
path = "crates/deshell/src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/P4suta/de-shell"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
find-msvc-tools = "=0.1.11"
libc = "0.2.189"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.4"
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-fish = "=3.6.0"
walkdir = "2.5.0"
syn = { version = "3.0.4", features = ["full", "visit"] }

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-batch.workspace = true
tree-sitter-fish.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
find-msvc-tools.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
