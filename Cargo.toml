[workspace]
members = ["xtask"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(deshell_sanitizer_address)", "cfg(deshell_sanitizer_undefined)"] }

[workspace.lints.clippy]
# The raw APIs listed in clippy.toml are unavailable outside the module that
# implements the intent they belong to. See clippy.toml for the reasoning.
disallowed_methods = "deny"
disallowed_types = "deny"

# An `#[allow]` must say why. The exemptions this crate carries are narrow — the
# transactional layer, and test modules that construct the very situations the
# production ban exists to prevent — and both are only reviewable if the reason
# travels with the attribute.
allow_attributes_without_reason = "deny"

# `#[allow]` itself is banned in favour of `#[expect]`. An `expect` that stops
# being necessary warns, so a suppression cannot outlive the thing it suppressed;
# an `allow` goes quiet forever and is how a ban rots into decoration.
allow_attributes = "deny"

[package]
name = "deshell"
description = "Shell retirement migration oracle with independent equivalence evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "deshell"
include = [
  "/crates/deshell/src/**",
  "/contracts/**",
  "/adapters/powershell/adapter.ps1",
  "/README.md",
  "/LICENSE",
]

[[bin]]
name = "deshell"
path = "crates/deshell/src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/P4suta/de-shell"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
find-msvc-tools = "=0.1.11"
libc = "0.2.189"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.4"
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-fish = "=3.6.0"
walkdir = "2.5.0"

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-batch.workspace = true
tree-sitter-fish.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
find-msvc-tools.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
