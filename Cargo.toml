[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "deshell"
description = "Shell retirement migration oracle with independent equivalence evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "deshell"
include = [
  "/crates/deshell/src/**",
  "/contracts/**",
  "/adapters/powershell/adapter.ps1",
  "/README.md",
  "/LICENSE",
]

[[bin]]
name = "deshell"
path = "crates/deshell/src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/P4suta/de-shell"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.4"
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-fish = "=3.6.0"
walkdir = "2.5.0"

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-batch.workspace = true
tree-sitter-fish.workspace = true
walkdir.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(deshell_sanitizer_address)", "cfg(deshell_sanitizer_undefined)"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
