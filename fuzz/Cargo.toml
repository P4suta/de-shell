[package]
name = "deshell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
libfuzzer-sys = "0.4.13"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.4"
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-batch = "=0.11.1"
tree-sitter-fish = "=3.6.0"
walkdir = "2.5.0"

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scanner"
path = "fuzz_targets/scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema"
path = "fuzz_targets/schema.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(deshell_sanitizer_address)", "cfg(deshell_sanitizer_undefined)"] }
