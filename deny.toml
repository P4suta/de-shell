[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
db-path = "target/advisory-db"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# RUSTSEC-2026-0173: proc-macro-error2 is unmaintained and has no patched release.
# It entered the graph only through the nu-* crates that the Nushell adapter used
# to link (removed in dcba51b). Relinking any nu-* crate would silently restore the
# advisory, so the reintroduction is rejected mechanically instead of by review.
deny = [
  { crate = "proc-macro-error", reason = "unmaintained; reintroduces RUSTSEC-2026-0173 (see also proc-macro-error2)" },
  { crate = "proc-macro-error2", reason = "unmaintained, no patched release; RUSTSEC-2026-0173. Nushell parsing is delegated to a pinned `nu` executable instead of linking nu-* crates" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
