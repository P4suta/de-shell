[tools]
opam = "2.5.2"
actionlint = "1.7.12"
rust = "1.98.0"
go = "1.27.0"
powershell = "7.6.5"
gh = "2.96.0"
dagger = "0.21.8"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"pipx:check-jsonschema" = "0.38.0"

[env]
CARGO_BUILD_JOBS = "1"

[tasks.setup]
description = "Fetch the locked Rust dependency graph"
run = "cargo fetch --locked"

[tasks.build]
description = "Build de-shell"
run = "cargo build --locked --workspace"

[tasks.deshell]
description = "Run the project-local deshell CLI"
run = "cargo run --locked -p deshell --"

[tasks."corpus:audit"]
description = "Audit sibling or curated repositories without executing source scripts"
depends = ["build"]
run = "pwsh -NoLogo -NoProfile -File scripts/audit-corpus.ps1"

[tasks.lint]
description = "Lint Rust, repository metadata, and GitHub Actions"
run = [
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "mise run repository:guardrails",
  "actionlint .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/nightly.yml .github/workflows/dependency-review.yml .github/workflows/scorecard.yml",
]

[tasks."repository:guardrails"]
description = "Reject tracked files over 10 MiB or paths over 240 characters"
run = "pwsh -NoLogo -NoProfile -File scripts/repository-guardrails.ps1"

[tasks."github:apply"]
description = "Apply the canonical GitHub repository settings and Rulesets"
run = "pwsh -NoLogo -NoProfile -File scripts/github-repository.ps1 -Mode Apply -Repository P4suta/de-shell"

[tasks."github:verify"]
description = "Verify GitHub repository settings and Rulesets against the canonical policy"
run = "pwsh -NoLogo -NoProfile -File scripts/github-repository.ps1 -Mode Verify -Repository P4suta/de-shell"

[tasks."test:fast"]
description = "Run deterministic unit and property tests"
run = "cargo test --locked -p deshell"

[tasks."test:contract"]
description = "Run CLI, schema, and adapter contract tests"
run = [
  "cargo build --locked -p deshell",
  "cargo run --locked -p xtask -- conformance target/debug/deshell",
]

[tasks."test:adapters"]
description = "Run internal JSON-RPC adapter and agent contracts"
run = "cargo test --locked -p deshell protocol::tests"

[tasks."test:official-exporters"]
description = "Validate and execute representative CWL, Dagger, and Nushell exports with pinned official tools"
depends = ["build"]
run = "pwsh -NoLogo -NoProfile -File scripts/validate-official-exporters.ps1"

[tasks."test:platform"]
description = "Run platform-facing tests"
run = [
  "cargo test --locked -p deshell agent_process::tests",
  "cargo test --locked -p deshell lab::tests",
  "cargo test --locked -p deshell local_backend::tests",
  "cargo test --locked -p deshell scanner::tests",
  "cargo test --locked -p deshell workspace::tests",
]

[tasks."test:differential"]
description = "Run differential behavior tests"
run = "cargo test --locked -p deshell differential::tests"

[tasks."test:security"]
description = "Run security regression tests"
run = [
  "cargo test --locked -p deshell patch::tests",
  "cargo test --locked -p deshell replay::tests",
  "cargo test --locked -p deshell strict_json::tests",
  "cargo test --locked -p deshell protocol::tests",
]

[tasks."test:supply-chain"]
description = "Audit advisories, licenses, duplicate dependencies, and dependency sources"
run = [
  "cargo audit --db target/cargo-audit-db --deny warnings",
  "cargo deny --locked check",
]

[tasks."test:schema-validator"]
description = "Validate schemas and generated v1 documents with an independent engine"
depends = ["build"]
run = "python3 scripts/validate-json-contracts.py target/debug/deshell"

[tasks.coverage]
description = "Measure line coverage and enforce the v0.1 90 percent release floor"
run = [
  "rustup component add llvm-tools-preview",
  "cargo llvm-cov --locked --workspace --all-targets --summary-only --fail-under-lines 90 -- --test-threads=1",
]

[tasks.test]
description = "Run the complete test suite"
run = [
  "cargo test --locked --workspace -- --test-threads=1",
  "cargo build --locked -p deshell",
  "cargo run --locked -p xtask -- conformance target/debug/deshell",
]

[tasks.performance]
description = "Record scan, simple local run, and release binary performance as JSON"
run = [
  "cargo build --locked --release -p deshell",
  "cargo run --locked -p xtask -- performance target/release/deshell",
]

[tasks.package]
description = "Build and verify the crates.io package payload"
run = "cargo package --locked --target-dir target/package-build"

[tasks.fmt]
description = "Format the Rust implementation"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."reference:setup"]
description = "Install dependencies for the unpublished OCaml reference implementation (the hosted CI VM disables nested opam sandboxing)"
run = [
  "opam init --cli=2.5 --bare --no-setup --no ${CI:+--disable-sandboxing}",
  "opam switch create . 5.5.0 --cli=2.5 --deps-only --with-test --with-dev-setup --locked --assume-depexts --yes || opam install . --cli=2.5 --switch=. --deps-only --with-test --with-dev-setup --locked --assume-depexts --yes",
]
run_windows = [
  "opam init --cli=2.5 --bare --no-setup --yes",
  "opam switch create . 5.5.0 --cli=2.5 --deps-only --with-test --with-dev-setup --locked --yes || opam install . --cli=2.5 --switch=. --deps-only --with-test --with-dev-setup --locked --yes",
]

[tasks."reference:build"]
description = "Build and check the unpublished OCaml Effect IR v1 reference"
run = "opam exec --switch=. -- dune build @reference-v1 -j 1"

[tasks."reference:test"]
description = "Compare the OCaml reference with the shared v1 golden corpus"
run = "opam exec --switch=. -- dune exec bin/reference_conformance.exe -- contracts/golden/frontend-v1.json contracts/golden/transform-export-v1.json"

[tasks."reference:fmt"]
description = "Format the unpublished OCaml v1 reference"
run = "opam exec --switch=. -- ocamlformat --inplace lib/reference_v1.ml bin/reference_conformance.ml"

[tasks."reference:fmt:check"]
description = "Check formatting of the unpublished OCaml v1 reference"
run = "opam exec --switch=. -- ocamlformat --check lib/reference_v1.ml bin/reference_conformance.ml"
